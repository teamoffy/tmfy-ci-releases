name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Check shell scripts
        run: |
          set -eu
          for script in scripts/*.sh; do
            [ "$script" = scripts/lib.sh ] || [ -x "$script" ] || {
              echo "$script is not executable" >&2
              exit 1
            }
            sh -n "$script"
          done
          shellcheck scripts/*.sh
      - name: Check OCI image manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 {
              print FILENAME ":" FNR ": expected four fields" > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate image name " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/oci-images.txt

          while read -r name _ _ transform || [ -n "$name" ]; do
            case "$name" in
              '' | '#'* ) continue ;;
            esac
            case "$transform" in
              -) ;;
              *) printf '%s\n' v1.2.3 | sed "$transform" >/dev/null ;;
            esac
          done <scripts/oci-images.txt
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/actionlint"
          archive="$tool_dir/actionlint.tar.gz"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -color
