name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Check shell scripts
        run: |
          set -eu
          for script in scripts/*.sh; do
            [ "$script" = scripts/lib.sh ] || [ -x "$script" ] || {
              echo "$script is not executable" >&2
              exit 1
            }
            sh -n "$script"
          done
          shellcheck scripts/*.sh
      - name: Check OCI image manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 {
              print FILENAME ":" FNR ": expected four fields" > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate image name " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/oci-images.txt

          while read -r name _ _ transform || [ -n "$name" ]; do
            case "$name" in
              '' | '#'* ) continue ;;
            esac
            case "$transform" in
              -) ;;
              *) printf '%s\n' v1.2.3 | sed "$transform" >/dev/null ;;
            esac
          done <scripts/oci-images.txt
      - name: Check CI tools manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 5 {
              print FILENAME ":" FNR ": expected five fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9-]+$/ {
              print FILENAME ":" FNR ": invalid tool name " $1 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate tool name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $2 > "/dev/stderr"
              failed = 1
            }
            $3 !~ /^https:\/\// || $4 !~ /^https:\/\// {
              print FILENAME ":" FNR ": download URLs must use HTTPS" > "/dev/stderr"
              failed = 1
            }
            $5 !~ /^(bin|tardir|tarbin:[A-Za-z0-9_.-]+)$/ {
              print FILENAME ":" FNR ": invalid mode " $5 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/ci-tools.txt
      - name: Check Pulumi plugin manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 3 {
              print FILENAME ":" FNR ": expected three fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9][a-z0-9-]*$/ {
              print FILENAME ":" FNR ": invalid provider name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[0-9]+\.[0-9]+\.[0-9]+$/ {
              print FILENAME ":" FNR ": invalid version " $2 > "/dev/stderr"
              failed = 1
            }
            $3 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $3 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate provider " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/pulumi-plugins.txt
      - name: Check GraalVM manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            $1 == "version" {
              version_seen++
              if (NF != 2) {
                print FILENAME ":" FNR ": version row takes exactly one value" > "/dev/stderr"
                failed = 1
              }
              next
            }
            NF != 3 {
              print FILENAME ":" FNR ": expected <platform> <artifact-id> <sha256>" > "/dev/stderr"
              failed = 1
              next
            }
            $1 !~ /^(linux|darwin)-(x64|arm64)$/ {
              print FILENAME ":" FNR ": unexpected platform " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[0-9A-F]{32}$/ {
              print FILENAME ":" FNR ": malformed GDS artifact id" > "/dev/stderr"
              failed = 1
            }
            $3 !~ /^[0-9a-f]{64}$/ {
              print FILENAME ":" FNR ": malformed sha256" > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate platform " $1 > "/dev/stderr"
              failed = 1
            }
            END {
              if (version_seen != 1) {
                print FILENAME ": expected exactly one version row" > "/dev/stderr"
                failed = 1
              }
              exit failed
            }
          ' scripts/graalvm.txt
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/actionlint"
          asset="actionlint-${ACTIONLINT_VERSION}-linux-x64.tar.zst"
          base="https://github.com/teamoffy/tmfy-ci-releases/releases/download/actionlint/v${ACTIONLINT_VERSION}"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 -o "$tool_dir/SHA256SUMS.txt" "$base/SHA256SUMS.txt" \
            -o "$tool_dir/$asset" "$base/$asset"
          (cd "$tool_dir" && grep " ${asset}\$" SHA256SUMS.txt | sha256sum -c -)
          tar --zstd -xf "$tool_dir/$asset" -C "$tool_dir"
          "$tool_dir/usr/local/bin/actionlint" -color
