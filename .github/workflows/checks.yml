name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Check shell scripts
        run: |
          set -eu
          for script in scripts/*.sh; do
            [ "$script" = scripts/lib.sh ] || [ -x "$script" ] || {
              echo "$script is not executable" >&2
              exit 1
            }
            sh -n "$script"
          done
          shellcheck scripts/*.sh
      - name: Check OCI image manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 4 {
              print FILENAME ":" FNR ": expected four fields" > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate image name " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/oci-images.txt

          while read -r name _ _ transform || [ -n "$name" ]; do
            case "$name" in
              '' | '#'* ) continue ;;
            esac
            case "$transform" in
              -) ;;
              *) printf '%s\n' v1.2.3 | sed "$transform" >/dev/null ;;
            esac
          done <scripts/oci-images.txt
      - name: Check CI tools manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 5 {
              print FILENAME ":" FNR ": expected five fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9-]+$/ {
              print FILENAME ":" FNR ": invalid tool name " $1 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate tool name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $2 > "/dev/stderr"
              failed = 1
            }
            ($3 !~ /^https:\/\// && $3 != "-") || ($4 !~ /^https:\/\// && $4 != "-") {
              print FILENAME ":" FNR ": download URLs must be HTTPS or \"-\"" > "/dev/stderr"
              failed = 1
            }
            $5 !~ /^(bin|tardir|tarbin:[A-Za-z0-9_.-]+)$/ {
              print FILENAME ":" FNR ": invalid mode " $5 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/ci-tools.txt
      - name: Check Pulumi plugin manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 2 {
              print FILENAME ":" FNR ": expected two fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9][a-z0-9-]*$/ {
              print FILENAME ":" FNR ": invalid provider name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $2 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate provider " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/pulumi-plugins.txt
      - name: Check stack manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 3 {
              print FILENAME ":" FNR ": expected three fields" > "/dev/stderr"
              failed = 1
              next
            }
            $1 !~ /^[a-z0-9][a-z0-9-]*$/ ||
            $2 !~ /^(k3s|oci-[a-z0-9][a-z0-9-]*)$/ ||
            $3 !~ /^[a-zA-Z0-9_][a-zA-Z0-9_.+-]*$/ {
              print FILENAME ":" FNR ": bad row: " $1 " " $2 " " $3 > "/dev/stderr"
              failed = 1
              next
            }
            {
              key = $1 SUBSEP $2
              if (seen[key]++) {
                print FILENAME ":" FNR ": duplicate stack product: " $1 " " $2 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          ' scripts/stacks.txt
          while read -r stack product _ || [ -n "$stack" ]; do
            case "$stack" in '' | '#'*) continue ;; esac
            case "$product" in
            k3s) ;;
            oci-*)
              awk -v n="${product#oci-}" 'NF >= 4 && $1 == n { found = 1 } END { exit !found }' \
                scripts/oci-images.txt || {
                  echo "scripts/stacks.txt: $product is not listed in oci-images.txt" >&2
                  exit 1
                } ;;
            esac
          done <scripts/stacks.txt
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/actionlint"
          asset="actionlint-${ACTIONLINT_VERSION}-linux-x64.tar.zst"
          base="https://github.com/teamoffy/tmfy-ci-releases/releases/download/actionlint/v${ACTIONLINT_VERSION}"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 -o "$tool_dir/SHA256SUMS.txt" "$base/SHA256SUMS.txt" \
            -o "$tool_dir/$asset" "$base/$asset"
          (cd "$tool_dir" && grep " ${asset}\$" SHA256SUMS.txt | sha256sum -c -)
          tar --zstd -xf "$tool_dir/$asset" -C "$tool_dir"
          "$tool_dir/usr/local/bin/actionlint" -color
