name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Check shell scripts
        run: |
          set -eu
          for script in scripts/*.sh; do
            [ "$script" = scripts/lib.sh ] || [ -x "$script" ] || {
              echo "$script is not executable" >&2
              exit 1
            }
            sh -n "$script"
          done
          shellcheck scripts/*.sh
      - name: Check OCI image manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 6 {
              print FILENAME ":" FNR ": expected six fields" > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate image name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ "^[A-Za-z0-9_.:/-]+$" {
              print FILENAME ":" FNR ": invalid registry repository " $2 > "/dev/stderr"
              failed = 1
            }
            $3 !~ "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" && $3 !~ /^(pin:|registry:|chart:)/ {
              print FILENAME ":" FNR ": invalid source " $3 > "/dev/stderr"
              failed = 1
            }
            $5 !~ /^(any|cilium|minor|minor-short|minor-trail1|same:[a-z0-9-]+|chart:[a-z0-9-]+)$/ {
              print FILENAME ":" FNR ": invalid k8s rule " $5 > "/dev/stderr"
              failed = 1
            }
            $6 != "shared" && $6 !~ /^[a-z0-9][a-z0-9-]*$/ {
              print FILENAME ":" FNR ": invalid scope " $6 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/oci-images.txt

          stacks=$(awk 'NF >= 3 && $1 !~ /^#/ { print $1 }' scripts/stacks.txt)
          components=$(awk 'NF && $1 !~ /^#/ { print $1 }' scripts/oci-images.txt)
          seen_file="${RUNNER_TEMP:-/tmp}/oci-components-seen"
          : >"$seen_file"
          while read -r name _ source transform rule scope || [ -n "$name" ]; do
            case "$name" in
              '' | '#'* ) continue ;;
            esac
            case "$transform" in
              -) ;;
              *) printf '%s\n' v1.2.3 | sed "$transform" >/dev/null ;;
            esac
            case "$rule" in
              any | cilium | minor | minor-short | minor-trail1) ;;
              same:* | chart:*)
                ref=${rule#*:}
                grep -qx "$ref" "$seen_file" || {
                  echo "scripts/oci-images.txt: $name: $rule must reference a component listed above it" >&2
                  exit 1
                }
                case "$rule" in
                  chart:*) [ "$ref" = cilium ] || {
                    echo "scripts/oci-images.txt: $name: only chart:cilium is supported" >&2
                    exit 1
                  } ;;
                esac ;;
              *) echo "scripts/oci-images.txt: $name: invalid k8s rule $rule" >&2; exit 1 ;;
            esac
            printf '%s\n' "$name" >>"$seen_file"
            case "$scope" in
              shared) ;;
              *)
                printf '%s\n' "$stacks" | grep -qx "$scope" || {
                  echo "scripts/oci-images.txt: $name: unknown scope $scope" >&2
                  exit 1
                } ;;
            esac
            case "$source" in
              registry:*)
                # grep exit 2 is a malformed regex; 1 just means no match.
                rc=0
                printf '' | grep -E "${source#registry:}" >/dev/null 2>&1 || rc=$?
                [ "$rc" -le 1 ] || {
                  echo "scripts/oci-images.txt: $name: malformed registry regex" >&2
                  exit 1
                } ;;
              chart:*)
                printf '%s\n' "$components" | grep -qx "${source#chart:}" || {
                  echo "scripts/oci-images.txt: $name: chart source references unknown component ${source#chart:}" >&2
                  exit 1
                } ;;
            esac
          done <scripts/oci-images.txt
      - name: Check CI tools manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 5 {
              print FILENAME ":" FNR ": expected five fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9-]+$/ {
              print FILENAME ":" FNR ": invalid tool name " $1 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate tool name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $2 > "/dev/stderr"
              failed = 1
            }
            ($3 !~ /^https:\/\// && $3 != "-") || ($4 !~ /^https:\/\// && $4 != "-") {
              print FILENAME ":" FNR ": download URLs must be HTTPS or \"-\"" > "/dev/stderr"
              failed = 1
            }
            $3 == "-" && $4 == "-" {
              print FILENAME ":" FNR ": both download URLs are \"-\" — nothing to build" > "/dev/stderr"
              failed = 1
            }
            $5 !~ /^(bin|tardir|tarbin:[A-Za-z0-9_.-]+)$/ {
              print FILENAME ":" FNR ": invalid mode " $5 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/ci-tools.txt
      - name: Check Pulumi plugin manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 2 {
              print FILENAME ":" FNR ": expected two fields" > "/dev/stderr"
              failed = 1
            }
            $1 !~ /^[a-z0-9][a-z0-9-]*$/ {
              print FILENAME ":" FNR ": invalid provider name " $1 > "/dev/stderr"
              failed = 1
            }
            $2 !~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/ {
              print FILENAME ":" FNR ": invalid GitHub repository " $2 > "/dev/stderr"
              failed = 1
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate provider " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/pulumi-plugins.txt
      - name: Check stack manifest
        run: |
          set -eu
          awk '
            /^[[:space:]]*(#|$)/ { next }
            NF != 3 {
              print FILENAME ":" FNR ": expected three fields (<stack> k8s <minor>)" > "/dev/stderr"
              failed = 1
              next
            }
            $1 !~ /^[a-z0-9][a-z0-9-]*$/ || $2 != "k8s" || $3 !~ /^([0-9]+\.[0-9]+|latest)$/ {
              print FILENAME ":" FNR ": bad row: " $1 " " $2 " " $3 > "/dev/stderr"
              failed = 1
              next
            }
            seen[$1]++ {
              print FILENAME ":" FNR ": duplicate stack " $1 > "/dev/stderr"
              failed = 1
            }
            END { exit failed }
          ' scripts/stacks.txt
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -eu
          tool_dir="$RUNNER_TEMP/actionlint"
          asset="actionlint-${ACTIONLINT_VERSION}-linux-x64.tar.zst"
          base="https://github.com/teamoffy/tmfy-ci-releases/releases/download/actionlint/v${ACTIONLINT_VERSION}"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 -o "$tool_dir/SHA256SUMS.txt" "$base/SHA256SUMS.txt" \
            -o "$tool_dir/$asset" "$base/$asset"
          (cd "$tool_dir" && grep " ${asset}\$" SHA256SUMS.txt | sha256sum -c -)
          tar --zstd -xf "$tool_dir/$asset" -C "$tool_dir"
          "$tool_dir/usr/local/bin/actionlint" -color
