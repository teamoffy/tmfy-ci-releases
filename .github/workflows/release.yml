name: PostgreSQL rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: sh

jobs:
  build-postgres:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs-on: ubuntu-26.04
          - platform: linux-arm64
            runs-on: ubuntu-26.04-arm
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Build and pack postgres
        env:
          POSTGRES_PLATFORM: ${{ matrix.platform }}
          POSTGRES_WORK: ${{ runner.temp }}/postgres-build
        run: |
          sh scripts/postgres-build.sh \
            "18.6" \
            "2.30.2" \
            "0.8.7" \
            "1.1.1"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-${{ matrix.platform }}
          path: ${{ runner.temp }}/postgres-build/out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release-postgres:
    needs: build-postgres
    if: needs.build-postgres.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PG: "18.6"
      TS: "2.30.2"
      VEC: "0.8.7"
      VCHORD: "1.1.1"
      VERSION: 18.6-timescale2.30.2-pgvector0.8.7-vchord1.1.1
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: postgres-*
          merge-multiple: true
          path: assets
      - name: Publish release
        run: |
          set -eu
          sh scripts/publish-release.sh "postgres/v${VERSION}" "postgres ${VERSION}" assets <<EOF
          Prebuilt PostgreSQL \`${PG}\` with timescaledb \`${TS}\`, pgvector \`${VEC}\`, and VectorChord \`${VCHORD}\` for CI consumption.

          - Upstream: https://ftp.postgresql.org/pub/source/v${PG}/ , https://github.com/timescale/timescaledb/releases/tag/${TS} , https://github.com/pgvector/pgvector/tree/v${VEC} , https://github.com/tensorchord/VectorChord/releases/tag/${VCHORD}
          - Build: \`./configure --with-icu --with-openssl\` + \`contrib/pgcrypto\` and \`contrib/pg_stat_statements\`; timescaledb bootstrap \`-DREGRESS_CHECKS=OFF -DWARNINGS_AS_ERRORS=OFF\`; VectorChord from the official \`postgresql-${PG%%.*}\` .deb.
          - Smoke-tested: initdb + server boot + \`CREATE EXTENSION\` for pgcrypto, pg_stat_statements, timescaledb, vector, and vchord; live query of the pg_stat_statements view.
          - Targets: linux-x64 (ubuntu-26.04 / gcc), linux-arm64 (ubuntu-26.04-arm / gcc). Links against the runner images' system OpenSSL/ICU/readline/zlib.
          - Layout: the archive root is \`opt/postgresql\` — extract at \`/\` to install into \`/opt/postgresql\`. Starting clusters and setting \`shared_preload_libraries=timescaledb,vchord,pg_stat_statements\` stay consumer-side; run \`CREATE EXTENSION pg_stat_statements\` in each database that needs query statistics.
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - Licenses: PostgreSQL License (postgres, pgvector); timescaledb is Apache-2.0 outside \`tsl/\` and Timescale License (TSL) within it — this build includes the TSL \`-tsl\` module; VectorChord is dual AGPL-3.0 / Elastic License v2
          EOF
