          - Smoke-tested: \`llama-cli --version\` runs and reports build ${VERSION#b}.
          - Targets: linux-x64 (upstream ubuntu-x64), linux-arm64 (ubuntu-arm64), darwin-arm64 (macos-arm64).
          - Layout: the archive root is \`opt/llama-embedding\` — extract at \`/\` to install into \`/opt/llama-embedding\`; native libraries and tools are in \`native/\`, and the model is \`models/embeddinggemma-300M-Q8_0.gguf\`. Extraction needs zstd: \`tar --zstd -xf <asset>\`
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - Licenses: MIT (llama.cpp); EmbeddingGemma is subject to the [Gemma Terms of Use](https://ai.google.dev/gemma/terms), including the prohibited-use policy. The archive includes the terms, policy, required \`NOTICE\`, and modification notice.
          EOF

  # ------------------------------------------------------------------ k3s
  # Build upstream latest plus any versions pinned in stacks.txt.
  build-k3s:
    needs: check
    if: needs.check.outputs.k3s_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.k3s_matrix) }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Mirror k3s release
        env:
          GH_TOKEN: ${{ github.token }}
          K3S_WORK: ${{ runner.temp }}/k3s-work
        run: sh scripts/k3s-mirror.sh "${{ matrix.version }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k3s-${{ matrix.version }}
          path: ${{ runner.temp }}/k3s-work/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-k3s:
    needs: [check, build-k3s]
    if: needs.check.outputs.k3s_build == 'true' && needs.build-k3s.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.k3s_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ matrix.version }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: k3s-${{ matrix.version }}
          path: assets
      - name: Publish release
        run: |
          set -eu
          install_sha=$(sha256sum assets/install.sh | cut -d ' ' -f1)
          sh scripts/publish-release.sh "k3s/v${VERSION}" "k3s ${VERSION}" assets <<EOF
          k3s ${VERSION} mirrored verbatim from k3s-io/k3s — the node binaries and zstd airgap images a node boot pulls.

          - Upstream: https://github.com/k3s-io/k3s/releases/tag/v${VERSION}
          - Assets: \`k3s\` (amd64), \`k3s-arm64\`, \`k3s-airgap-images-{amd64,arm64}.tar.zst\`, \`k3s-images.txt\`, \`install.sh\`. Only the zstd airgap variants are mirrored.
          - Verified: binaries and airgap tarballs against upstream \`sha256sum-<arch>.txt\`; all release assets against their GitHub asset digests. \`install.sh\` ships in the git tree, not as a release asset — no upstream checksum exists; as-shipped sha256 \`${install_sha}\`.
          - Use (airgap): install \`k3s\`/\`k3s-arm64\` to \`/usr/local/bin/k3s\`, drop the matching airgap tarball into \`/var/lib/rancher/k3s/agent/images/\`, then \`INSTALL_K3S_SKIP_DOWNLOAD=true sh install.sh\`.
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - License: Apache-2.0 (upstream)
          EOF

  # ------------------------------------------------------------ k3s-system
  # One cell per (k3s version, image) — check.sh resolves each built version's
  # enabled images from its k3s-images.txt; the release job merges a version's
  # cells into a single k3s-system/v<version> release.
  build-k3s-system:
    needs: check
    if: needs.check.outputs.k3s_system_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.k3s_system_images_matrix) }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Mirror image as zstd:chunked OCI layout
        env:
          OCI_WORK: ${{ runner.temp }}/k3s-system-work
        run: sh scripts/oci-mirror.sh "${{ matrix.name }}" "${{ matrix.ref }}"
      - name: Tag image provenance for the release notes
        run: >-
          mv "${{ runner.temp }}/k3s-system-work/out/release-info.env"
          "${{ runner.temp }}/k3s-system-work/out/upstream-info-${{ matrix.name }}.env"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k3s-system-${{ matrix.version }}-${{ matrix.name }}
          path: ${{ runner.temp }}/k3s-system-work/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-k3s-system:
    needs: [check, build-k3s-system]
    if: needs.check.outputs.k3s_system_build == 'true' && needs.build-k3s-system.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.k3s_system_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      K3S_VERSION: ${{ matrix.version }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: k3s-system-${{ matrix.version }}-*
          merge-multiple: true
          path: assets
      - name: Publish release
        run: |
          set -eu
          image_lines=$(for f in assets/upstream-info-*.env; do
            [ -f "$f" ] || continue
            # shellcheck disable=SC1090 # generated env files from the build job
            . "$f"
            printf "    - \`%s\` -> \`oci-%s-%s-oci.tar.zst\` (upstream %s -> layout %s)\n" \
              "$REF" "$NAME" "$VERSION" "$UPSTREAM_DIGEST" "$OCI_DIGEST"
          done)
          sh scripts/publish-release.sh "k3s-system/v${K3S_VERSION}" "k3s-system ${K3S_VERSION}" assets <<EOF
          zstd:chunked mirrors of the enabled system images listed in k3s v${K3S_VERSION}'s \`k3s-images.txt\`.

          - Source: https://github.com/k3s-io/k3s/releases/download/v${K3S_VERSION}/k3s-images.txt, verified against its GitHub asset digest. Images disabled by tea (traefik, metrics-server, and klipper-lb) are skipped.
          - Images (upstream digest -> layout digest):
          ${image_lines}
          - Repack: \`skopeo copy --all --dest-compress-format zstd:chunked --dest-compress-level 19 --dest-force-compress-format\`; layers re-encoded, so digests differ from upstream.
          - Use: extract the asset (its root is an OCI layout dir), then \`skopeo copy --all --preserve-digests oci:<dir>:<tag> docker://<registry>/<repo>:<tag>\`, or feed an OCI-layout consumer directly (e.g. sync-oci-to-s3.sh).
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - Licenses: unchanged from the upstream images
          EOF

  # ---------------------------------------------------------------- flatcar
  # Byte-verbatim mirror of the release artifacts tea consumes: the openstack
  # image (UpCloud/Alibaba imports), the GCE tarball (GCP import), and the
  # developer container (the sysext build's kernel-matched toolchain).
  # One cell per artifact — GCE is amd64-only: Flatcar publishes no arm64
  # GCE image.
  build-flatcar:
    needs: check
    if: needs.check.outputs.flatcar_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            file: flatcar_production_openstack_image.img.bz2
            kind: openstack
          - arch: amd64
            file: flatcar_production_gce.tar.gz
            kind: gce
          - arch: amd64
            file: flatcar_developer_container.bin.bz2
            kind: dev-container
          - arch: arm64
            file: flatcar_production_openstack_image.img.bz2
            kind: openstack
          - arch: arm64
            file: flatcar_developer_container.bin.bz2
            kind: dev-container
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Mirror artifact
        env:
          FLATCAR_WORK: ${{ runner.temp }}/flatcar-work
        run: >-
          sh scripts/flatcar-mirror.sh "${{ needs.check.outputs.flatcar_version }}"
          "${{ matrix.arch }}" "${{ matrix.file }}" "${{ matrix.kind }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatcar-${{ needs.check.outputs.flatcar_version }}-${{ matrix.kind }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/flatcar-work/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-flatcar:
    needs: [check, build-flatcar]
    if: needs.check.outputs.flatcar_build == 'true' && needs.build-flatcar.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.flatcar_version }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flatcar-${{ needs.check.outputs.flatcar_version }}-*
          merge-multiple: true
          path: assets
      - name: Publish release
        run: |
          set -eu
          sh scripts/publish-release.sh "flatcar/v${VERSION}" "flatcar ${VERSION}" assets <<EOF
          Flatcar Container Linux stable ${VERSION} release artifacts, mirrored byte-for-byte so pinned versions remain available after upstream pruning.

          - Upstream: https://stable.release.flatcar-linux.net/<arch>-usr/${VERSION}/ (e.g. amd64-usr)
          - Assets per arch (amd64, arm64): \`flatcar-openstack-${VERSION}-<arch>.img.bz2\` (UpCloud/Alibaba imports), \`flatcar-dev-container-${VERSION}-<arch>.bin.bz2\` (kernel-matched build container — the flatcar-zfs-sysext input); plus amd64-only \`flatcar-gce-${VERSION}-amd64.tar.gz\` (GCE import — upstream ships no arm64 GCE image)
          - Verified: upstream sha512 from each artifact's \`.DIGESTS\` sidecar before upload. Bytes are unchanged, so the upstream digests still apply.
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - Licenses: Flatcar is Apache-2.0 build tooling; the image contents carry their own licenses — see https://www.flatcar.org/releases/
          EOF

  # ------------------------------------------------- flatcar-zfs-sysext
  # OpenZFS as a systemd-sysext image, built inside the target Flatcar
  # release's own developer container — kernel modules are not cross-built, so
  # each arch needs a native runner.
  build-flatcar-zfs-sysext:
    needs: check
    if: needs.check.outputs.flatcar_zfs_sysext_build == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs-on: ubuntu-26.04
          - platform: linux-arm64
            runs-on: ubuntu-26.04-arm
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Build sysext
        env:
          GH_TOKEN: ${{ github.token }}
          FLATCAR_ZFS_PLATFORM: ${{ matrix.platform }}
          FLATCAR_ZFS_WORK: ${{ runner.temp }}/flatcar-zfs-work
        run: |
          sh scripts/flatcar-zfs-sysext-build.sh \
            "${{ needs.check.outputs.flatcar_zfs_sysext_flatcar }}" \
            "${{ needs.check.outputs.flatcar_zfs_sysext_zfs }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfs-sysext-${{ matrix.platform }}
          path: ${{ runner.temp }}/flatcar-zfs-work/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-flatcar-zfs-sysext:
    needs: [check, build-flatcar-zfs-sysext]
    if: needs.check.outputs.flatcar_zfs_sysext_build == 'true' && needs.build-flatcar-zfs-sysext.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLATCAR: ${{ needs.check.outputs.flatcar_zfs_sysext_flatcar }}
      ZFS: ${{ needs.check.outputs.flatcar_zfs_sysext_zfs }}
      VERSION: ${{ needs.check.outputs.flatcar_zfs_sysext_version }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zfs-sysext-*
          merge-multiple: true
          path: assets
      - name: Publish release
        run: |
          set -eu
          input_shas=$(
            for input in assets/upstream-sha256-*.txt; do
              platform=${input#assets/upstream-sha256-}
              platform=${platform%.txt}
              printf "    %s:\n" "$platform"
              sed "s/^/      /" "$input"
            done
          )
          raw_shas=$(for f in assets/*.raw; do
            printf "    \`%s\` %s\n" "$(basename "$f")" "$(sha256sum "$f" | cut -d ' ' -f1)"
          done)
          sh scripts/publish-release.sh "flatcar-zfs-sysext/v${VERSION}" "flatcar-zfs-sysext ${VERSION}" assets <<EOF
          OpenZFS ${ZFS} as a systemd-sysext image for Flatcar stable ${FLATCAR}, built inside that release's own developer container so the module matches its kernel.

          - Upstream: https://github.com/openzfs/zfs/releases/tag/zfs-${ZFS} , https://stable.release.flatcar-linux.net/<arch>-usr/${FLATCAR}/
          - Inputs verified: the zfs tarball against its GitHub asset digest; the developer container against its .DIGESTS sha512. Input sha256s:
          ${input_shas}
          - Merge gate: the image-matched \`extension-release.<asset name>\` pins \`ID=flatcar\` + \`VERSION_ID=${FLATCAR}\` + \`ARCHITECTURE=<arch>\`. systemd-sysext refuses the image on any other Flatcar version, so a node pin bump needs the matching release here (force-rebuild \`flatcar-zfs-sysext\` with \`<flatcar>/<zfs>\` if it was never upstream-latest).
          - Assets: \`zfs-${ZFS}-${FLATCAR}-x86-64.raw\` and \`...-arm64.raw\`, squashfs/zstd. Drop into \`/etc/extensions\` (or an ignition sysext fetch) and \`systemd-sysext refresh\`; \`modprobe zfs\` resolves via the embedded depmod output.
          - Per-asset sha256 (the sysext pin values):
          ${raw_shas}
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - License: CDDL-1.0 (OpenZFS)
          EOF

  # -------------------------------------------------------------- ci tools
  # Verified mirrors of the small public binaries tea pins by sha256 — one
  # matrix cell per tool, one <name>/v<version> release each.
  build-ci-tools:
    needs: check
    if: needs.check.outputs.tools_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # check.sh emits the complete {"include":[...]} matrix object.
      matrix: ${{ fromJSON(needs.check.outputs.tools_matrix) }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Repack tool
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLS_WORK: ${{ runner.temp }}/ci-tools-work
        run: sh scripts/tool-repack.sh "${{ matrix.name }}" "${{ matrix.tag }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-${{ matrix.name }}
          path: ${{ runner.temp }}/ci-tools-work/out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-ci-tools:
    needs: [check, build-ci-tools]
    if: needs.check.outputs.tools_build == 'true' && needs.build-ci-tools.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.tools_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tool-${{ matrix.name }}
          path: assets
      - name: Publish release
        run: |
          set -eu
          # shellcheck disable=SC1091 # generated env file from the build job
          . assets/release-info.env
          rm -f assets/release-info.env
          case "$MODE" in
          tardir) layout="extract at \`/\` — the install lands in \`/opt/$NAME\`" ;;
          *) layout="extract at \`/\` — the binary lands in \`/usr/local/bin\`" ;;
          esac
          sh scripts/publish-release.sh "$NAME/v$VERSION" "$NAME $VERSION" assets <<EOF
          $NAME $TAG upstream downloads, verified and repacked as max-zstd (level 22) tar.zst for linux-x64 and linux-arm64.

          - Upstream: https://github.com/$REPO/releases/tag/$TAG
          - Verified: each downloaded file against its upstream checksum — the GitHub asset digest for github.com downloads, or the published .sha256/.sha256sum sidecar or per-directory SHASUMS256.txt/sha256sums.txt otherwise.
          - Layout: $layout — \`tar --zstd -xf <asset>\` needs zstd (preinstalled on GitHub runner images)
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - License: see the upstream repository
          EOF

  # ---------------------------------------------------------- oci mirrors
  # One matrix cell per image: skopeo re-encodes every published arch to
  # zstd:chunked in a single copy, so there is no separate platform matrix.
  build-oci-mirror:
    needs: check
    if: needs.check.outputs.oci_build == 'true'
    runs-on: ubuntu-26.04
    # The skopeo zstd:chunked re-encode dominates the job and grows with image
    # size (the GCP PD CSI driver takes ~10 min) — keep generous headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # check.sh emits the complete {"include":[...]} matrix object.
      matrix: ${{ fromJSON(needs.check.outputs.oci_matrix) }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Mirror image as zstd:chunked OCI layout
        env:
          OCI_WORK: ${{ runner.temp }}/oci-mirror
        run: sh scripts/oci-mirror.sh "${{ matrix.name }}" "${{ matrix.ref }}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-${{ matrix.name }}-${{ matrix.version }}
          path: ${{ runner.temp }}/oci-mirror/out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release-oci-mirror:
    needs: [check, build-oci-mirror]
    if: needs.check.outputs.oci_build == 'true' && needs.build-oci-mirror.result == 'success'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.oci_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-${{ matrix.name }}-${{ matrix.version }}
          path: assets
      - name: Publish release
        run: |
          set -eu
          # shellcheck disable=SC1091 # generated env file from the build job
          . assets/release-info.env
          rm -f assets/release-info.env
          sh scripts/publish-release.sh "oci-$NAME/v$VERSION" "oci-$NAME $VERSION" assets <<EOF
          zstd:chunked mirror of upstream image \`$REF\`, packed as an OCI image layout in tar.zst.

          - Upstream: \`$REF\` (top-level manifest digest \`$UPSTREAM_DIGEST\`)
          - Repack: \`skopeo copy --all --dest-compress-format zstd:chunked --dest-compress-level 19 --dest-force-compress-format\`; all layers re-encoded, so digests differ from upstream. This layout's top-level digest: \`$OCI_DIGEST\`
          - Layout: the archive root is \`oci-$NAME-$VERSION/\` — an OCI image layout (\`index.json\` + \`blobs/\`), tagged \`$TAG\`
          - Use: extract, then seed a registry that accepts OCI zstd layers with \`skopeo copy --all --preserve-digests oci:oci-$NAME-$VERSION:$TAG docker://<registry>/<repo>:$TAG\`. Preserving digests keeps the zstd:chunked metadata so containers/storage clients with partial pulls enabled can use range requests and reuse chunks. The extracted layout can also feed an OCI-layout consumer directly (e.g. sync-oci-to-s3.sh, or \`skopeo copy oci:... oci-archive:...\` for \`ctr images import\`).
          - Verify: \`sha256sum -c SHA256SUMS.txt\`
          - Licenses: unchanged from the upstream image; see its project and image metadata
          EOF

  # ---------------------------------------------------------------- cleanup
  cleanup:
    needs:
      [
        release-aws-lc,
        release-bun,
        release-graalvm,
        release-zlib-ng,
        release-postgres,
        release-valkey,
        release-clickhouse,
        release-pebble,
        release-typesense,
        release-zstd,
        release-libgit2,
        release-sqlite-vec,
        release-llama-embedding,
        release-k3s,
        release-k3s-system,
        release-flatcar,
        release-flatcar-zfs-sysext,
        release-ci-tools,
        release-oci-mirror,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RELEASES: "15"
    steps:
      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Prune old releases
        run: sh scripts/prune-releases.sh
